version: '3.8'

services:
  zbgym:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zbgym
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
      - ./replays:/app/replays
    environment:
      - PYTHONUNBUFFERED=1
    stdin_open: true
    tty: true
    command: python -m zbgym.cli.main train --timesteps 100000

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zbgym-dashboard
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
    command: python -m zbgym.cli.main dashboard --host 0.0.0.0 --port 8000
