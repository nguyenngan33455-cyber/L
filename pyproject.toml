[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "zbgym"
version = "0.1.0"
description = "ZBGym: A professional Reinforcement Learning battle arena simulator"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "ZBGym Team", email = "team@zbgym.dev" }
]
keywords = ["reinforcement-learning", "gym", "rl", "battle-arena", "simulator", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "gymnasium>=0.29.0",
    "numpy>=1.24.0",
    "numpy-groupies>=0.9.20",
    "scipy>=1.11.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "dataclasses-json>=0.6.0",
    "typing-extensions>=4.8.0",
    "tqdm>=4.66.0",
    "coloredlogs>=15.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
    "hypothesis>=6.88.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
    "mkdocs>=1.5.0",
    "mkdocstrings[python]>=0.22.0",
]
trainer = [
    "stable-baselines3>=2.2.0",
    "torch>=2.0.0",
    "tensorboard>=2.14.0",
]
dashboard = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "asyncpg>=0.29.0",
]
all = [
    "zbgym[dev,trainer,dashboard]",
]

[project.scripts]
zbgym = "zbgym.cli:main"

[project.urls]
Homepage = "https://github.com/zbgym/zbgym"
Documentation = "https://zbgym.readthedocs.io"
Repository = "https://github.com/zbgym/zbgym"
Issues = "https://github.com/zbgym/zbgym/issues"
Changelog = "https://github.com/zbgym/zbgym/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.sdist]
include = ["/zbgym"]

[tool.hatch.build.targets.wheel]
packages = ["zbgym"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "DTZ", "T10", "ISC", "ICN", "PIE", "PT", "RET", "SIM", "TCH", "ARG", "PTH", "ERA", "PL", "TRY", "RUF"]
ignore = ["E501", "TRY003"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401", "E402"]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | __pycache__
)/
'''

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/", "docs/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --cov=zbgym --cov-report=term-missing --cov-fail-under=90"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["zbgym"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
